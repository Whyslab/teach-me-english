name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # sqlite3 builds a native binding; npm in newer versions blocks install
      # scripts by default, which leaves the binding missing.
      - name: Install dependencies
        run: |
          npm ci --foreground-scripts || npm install --foreground-scripts
          npm rebuild sqlite3 --foreground-scripts

      - name: Tests
        run: npm test

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check every JavaScript file
        run: |
          for f in server.js app.js sw.js; do
            node --check "$f"
          done

      # The service worker and the manifest have to agree on the icons, or the
      # app installs with a broken icon set.
      - name: Manifest is valid JSON and its icons exist
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
              throw new Error("manifest declares no icons");
            }
            for (const icon of manifest.icons) {
              const file = icon.src.replace(/^\//, "");
              if (!fs.existsSync(file)) {
                throw new Error(`manifest references a missing icon: ${icon.src}`);
              }
            }
            console.log(`manifest OK — ${manifest.icons.length} icons, all present`);
          '
